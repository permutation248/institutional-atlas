name: Validate and build atlas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build dependency
        run: python -m pip install -r requirements.txt
      - name: Validate records and build offline explorer
        run: python scripts/build.py
      - name: Run schema, regression and security tests
        run: python -m unittest discover -s tests -v
      - name: Check local launcher syntax
        run: bash -n scripts/dev.sh 启动图谱.command
      - name: Save offline build for review
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: institutional-atlas-offline
          path: |
            dist/index.html
            dist/atlas.json
            dist/coverage.json
          if-no-files-found: error
          retention-days: 14
